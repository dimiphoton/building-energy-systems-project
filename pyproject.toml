[project]
name = "building-energy"
version = "1.0.0"
description = "Heat balance and energy class of a Swedish multi-family house (course ETA013)."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
building-energy = "building_energy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
